name = "budjo"
main = "apps/api/src/index.ts"
compatibility_date = "2024-12-05"
compatibility_flags = ["nodejs_compat"]

# Served from a custom domain rather than *.workers.dev. Passkeys are bound to
# the hostname, so settling this before anyone registers avoids everyone having
# to re-enrol later. Wrangler creates the DNS record and the domain binding.
workers_dev = false

[[routes]]
pattern = "budjo.theserenelifestyle.com"
custom_domain = true

# The Worker serves the built PWA as static assets and handles /api itself.
# not_found_handling = "none" so unknown paths fall through to the Worker,
# which returns the SPA shell for client-side routes and JSON 404s for /api.
[assets]
directory = "./apps/web/dist"
binding = "ASSETS"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "budjo"
database_id = "8f694d21-24ed-451d-a53d-251fd9e05de6"
migrations_dir = "migrations"

# Daily at 06:00 UTC: allocate the month, repay advances, expire stale holds.
[triggers]
# Daily maintenance, and a weekly snapshot on Sunday morning.
crons = ["0 6 * * *", "0 7 * * SUN"]

# Weekly database snapshots, written by the Sunday cron.
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "budjo-backups"

[vars]
APP_NAME = "Budjo"
# Overridden to "development" in .dev.vars for local work.
APP_ENV = "production"
